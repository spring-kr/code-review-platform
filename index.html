<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="theme-color" content="#127c7c" />
    <meta name="description" content="브라우저 기반 코드 품질 분석 플랫폼 — 복잡도, 버그 위험, 유지보수성을 한 화면에서 추적합니다." />
    <title>Code Review Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#app" class="skip-link">본문으로 건너뛰기</a>
    <noscript>
      <div class="noscript">
        이 애플리케이션을 사용하려면 브라우저에서 JavaScript를 활성화해야 합니다.
      </div>
    </noscript>
    <main id="app" role="main" aria-label="코드 리뷰 플랫폼"></main>
    <div id="toast-container" role="region" aria-label="알림" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
